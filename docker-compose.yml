services:
  # ==============================================================================
  # MongoDB - Base NoSQL pour les données non-tabulaires (scraping, avis, annonces)
  # ==============================================================================
  mongodb:
    image: mongo:7.0
    container_name: homepedia-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-homepedia}
    volumes:
      - mongo_data:/data/db
    networks:
      - homepedia-net

  # ==============================================================================
  # Mongo Express - Interface Web pour visualiser et explorer MongoDB (port 8081)
  # ==============================================================================
  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: homepedia-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false" # Accès direct en local sans login additionnel
    depends_on:
      - mongodb
    networks:
      - homepedia-net

  # ==============================================================================
  # PostgreSQL - Base relationnelle SQL pour les données tabulaires et référentiels
  # ==============================================================================
  postgres:
    image: postgres:16
    container_name: homepedia-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homepedia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homepedia_secret}
      POSTGRES_DB: ${POSTGRES_DB:-homepedia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - homepedia-net

  # ==============================================================================
  # pgAdmin - Interface Web pour administrer PostgreSQL (port 5050)
  # ==============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: homepedia-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@homepedia.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - homepedia-net

volumes:
  mongo_data:
    driver: local
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  homepedia-net:
    driver: bridge
